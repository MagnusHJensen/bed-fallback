plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'

    id "me.shedaniel.unified-publishing" version "0.1.+"
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

unifiedPublishing {
    def mod_version = version
    project {
        displayName = "${mod_name} (NeoForge) - v${mod_version} - ${minecraft_version}" // Optional, name of the file
        version = "${mod_version}" // Optional, Inferred from project by default
        changelog = rootProject.file("CHANGELOG.md").text // Optional, in markdown format
        releaseType = "release" // Optional, use "release", "beta" or "alpha"
        gameVersions = ["1.21.1"]
        gameLoaders = ["neoforge"]

        mainPublication tasks.named('jar', Jar).flatMap { it.archiveFile } // Declares the publicated jar


        var cfToken = System.getenv("CURSEFORGE_TOKEN")
        if (cfToken != null) {
            curseforge {
                token = System.getenv("CURSEFORGE_TOKEN")
                id = "1417073" // Required, must be a string, ID of CurseForge project
            }
        }


        var mrToken = System.getenv("MODRINTH_TOKEN")
        if (mrToken != null) {
            modrinth {
                token = System.getenv("MODRINTH_TOKEN")
                id = "DcqGggcs" // Required, must be a string, ID of Modrinth project
            }
        }
    }
}