# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.2.1
group=dk.magnusjensen.bedfallback
java_version=21

# Common
minecraft_version=1.21.1
mod_name=BedFallback
mod_author=legenden (MagnusHJensen)
mod_id=bedfallback
license=LGPL-3.0
credits=
description=If your bed is broken, your spawn point is your previous bed
homepage=https://curseforge.com/minecraft/mc-mods/bedfallback
github=https://github.com/magnushjensen/bed-fallback
minecraft_version_range=[1.21.1, 1.22)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# Fabric
fabric_version=0.109.0+1.21.1
fabric_loader_version=0.16.9

# NeoForge
neoforge_version=21.1.80
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
