plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'

    id "me.shedaniel.unified-publishing" version "0.1.13"
}
dependencies {
    // Minecraft is no longer obfuscated as of 26.1, so there is no mappings block and no remapping step.
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:26.2.1"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
unifiedPublishing {
    def mod_version = version
    project {
        displayName = "${mod_name} (Fabric) - v${mod_version} - ${minecraft_version}" // Optional, name of the file
        version = "${mod_version}" // Optional, Inferred from project by default
        changelog = rootProject.file("CHANGELOG.md").text // Optional, in markdown format
        releaseType = "release" // Optional, use "release", "beta" or "alpha"
        gameVersions = [minecraft_version]
        gameLoaders = ["fabric"]

        mainPublication tasks.named('jar', Jar).flatMap { it.archiveFile } // Declares the publicated jar

        relations {
            depends {
                modrinth = "forge-config-api-port"
                curseforge = "forge-config-api-port"
            }
            depends {
                modrinth = "fabric-api"
                curseforge = "fabric-api"
            }
        }


        var cfToken = System.getenv("CURSEFORGE_TOKEN")
        if (cfToken != null) {
            curseforge {
                token = System.getenv("CURSEFORGE_TOKEN")
                id = "1417073" // Required, must be a string, ID of CurseForge project
            }
        }


        var mrToken = System.getenv("MODRINTH_TOKEN")
        if (mrToken != null) {
            modrinth {
                token = System.getenv("MODRINTH_TOKEN")
                id = "DcqGggcs" // Required, must be a string, ID of Modrinth project
            }
        }
    }
}